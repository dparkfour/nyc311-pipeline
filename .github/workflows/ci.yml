name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Keeps the repository "active" in GitHub's eyes. Scheduled workflows are
  # disabled automatically after 60 days of repository inactivity, which would
  # silently stop the ingestion cron next to it — the failure this project is
  # most likely to hit, and the one that looks worst if it happens in March.
  schedule:
    - cron: "0 6 1 * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Test
        # No DATABASE_URL, so integration tests are skipped by the marker in
        # conftest. Every validation, dedup, geo and shaping test runs — they
        # are pure functions and need nothing to run against.
        run: pytest -v --cov=app --cov-report=term-missing

      - name: Import check
        # Catches a broken import in the API or ingest modules, which the pure
        # unit tests would not exercise.
        run: python -c "import app.main, app.cli, app.pipeline.ingest"

  docker:
    name: docker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t nyc311-pipeline:ci .

      - name: Container starts and serves
        run: |
          docker run -d --name api -p 8000:8000 -e PORT=8000 nyc311-pipeline:ci
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8000/ > /dev/null; then
              echo "container is serving"
              docker rm -f api
              exit 0
            fi
            sleep 2
          done
          echo "container did not serve within 40s"
          docker logs api
          exit 1

  web:
    name: web build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        working-directory: web
        # `npm ci` once package-lock.json is committed (run `npm install` in
        # web/ locally and commit the lock file — reproducible installs are
        # worth the one extra file). Falls back so the first CI run is green
        # before that lock file exists.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::No package-lock.json — commit one for reproducible builds"
            npm install
          fi

      - name: Build
        working-directory: web
        run: npm run build
