# Render blueprint. Two services, no database.
#
# The database is on NEON, deliberately and not negotiably: Render's free
# PostgreSQL is deleted 30 days after creation (it used to be 90), which would
# turn a link shipped in October into a dead link by mid-November. Neon's free
# plan has no expiry and scales to zero when idle.
#
# To use this: Render dashboard -> New -> Blueprint -> point at the repo. Set
# DATABASE_URL + SOCRATA_APP_TOKEN on the API service (Neon's pooled string).
# Then read the API service's real URL off its dashboard page -- Render appends
# a random suffix when the name is taken, e.g. nyc311-api-gu7i.onrender.com --
# and set it as VITE_API_BASE on the web service, then redeploy the web
# service with "Clear build cache & deploy" (Vite bakes the URL in at build).

services:
  - type: web
    name: nyc311-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: ohio            # nearest to Neon's aws-us-east-2
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false         # set in the dashboard; never committed
      - key: SOCRATA_APP_TOKEN
        sync: false
      - key: CORS_ORIGINS
        # Tighten this to the static site's origin once it has been created.
        value: "*"

  # A static site takes no `plan` (always free, served from Render's CDN) and
  # no `region`. Both are valid on the Docker service above.
  - type: web
    name: nyc311-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        sync: false         # the API service's real URL; see header note
    routes:
      # Single-page app: every path serves index.html and React routes it.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
